<p *ngIf="error" role="alert" class="alert alert-warning m-3">{{ error }}</p>
<div class="conatiner-fluid content-inner mt-1 py-0">
  <div class="mt-5">
    <div class="row ms-5 me-5 justify-content-around">
      <div class="col-12 col-md-10 shadow card mb-5 rounded">
        <div class="mx-2 mt-2">
          <h2>Airport</h2>
          <div class="row justify-content-between mb-2">
            <div class="col-2 col-md-2 pe-0">
              <form (submit)="$event.preventDefault()" class="form-inline search-box d-flex d-inline">
                <input id="search" #inventoryFilter (input)="onFilter($any($event.target).value)" class="form-control w-auto" type="search" placeholder="Search..." aria-label="Search"
                  autocomplete="off" />

              </form>
              <div class="suggestions scrollable"></div>
            </div>

            <div class="col-5 ps-0">
              <div class="add-airport">
                <input type="file" id="fileLoader" name="files" title="Load File" hidden accept=".csv" #fileUpload
                  (change)="addCsv($event)" />
                <button id="add-airport-file" type="button" class="btn text-light primary-color"
                  (click)="fileUpload.click()">
                  Add CSV
                </button>
                <button type="button" class="btn text-light primary-color" id="add-airport-btn"
                  (click)="openUpdateAirportModal()">
                  Add Airport
                </button>
              </div>
            </div>
          </div>

          <div class="row justify-content-around">
            <div class="col">
              <p class="table-scroll-hint">Scroll the table to see all columns and actions.</p><div class="inventory-table-wrap airport-table" tabindex="0" role="region" aria-label="Inventory table"><table id="myTable" class="table table-hover mx-auto caption-top table-responsive-md table-responsive-sm">
                <thead class="table-dark">
                  <tr>
                    <th scope="col">#</th>
                    <th scope="col" class="table-header" data-name="name">
                      Name
                    </th>
                    <th scope="col" class="table-header" data-name="abbrivation">
                      Abbreviation
                    </th>
                    <th scope="col">Actions</th>
                  </tr>
                </thead>

                <tbody id="airportData">
<tr *ngIf="inventoryFilter.value && !totalPages.length"><td colspan="10">No matching records. Try another search.</td></tr>
                  <tr *ngFor="
                      let airport of currentPageData$ | async;
                      let i = index
                    ">
                    <th scope="col">
                      {{ pageSize * selectedPageNumber + i + 1 }}
                    </th>
                    <td>{{ airport.airportName }}</td>
                    <td>{{ airport.abbreviation }}</td>
                    <td>
                      <button type="button" class="btn btn-sm btn-outline-primary" (click)="openUpdateAirportModal(airport)">Edit</button>
                      <button type="button" class="btn btn-sm btn-outline-danger" (click)="deleteAirport(airport.abbreviation)">Delete</button>
                    </td>
                  </tr>
                </tbody>
              </table></div>
            </div>
          </div>
          <!-- pagination section -->
          <div class="row justify-content-center">
            <div class="col-9">
              <nav class="inventory-pagination" aria-label="Inventory pages"><button type="button" class="btn btn-outline-secondary" [disabled]="selectedPageNumber <= 0" (click)="onPageChange(selectedPageNumber - 1)">Previous</button><label>Page <select class="form-select" [ngModel]="selectedPageNumber" (ngModelChange)="onPageChange(+$event)" [ngModelOptions]="{standalone: true}" [disabled]="!totalPages.length"><option *ngFor="let page of totalPages" [ngValue]="page">{{ page + 1 }}</option></select> of {{ totalPages.length || 1 }}</label><button type="button" class="btn btn-outline-secondary" [disabled]="selectedPageNumber >= totalPages.length - 1" (click)="onPageChange(selectedPageNumber + 1)">Next</button></nav>
            </div>
          </div>
          <!-- //// -->
        </div>
      </div>
    </div>
  </div>
</div>
