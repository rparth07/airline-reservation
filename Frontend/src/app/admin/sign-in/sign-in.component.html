<section class="sign-in"><a routerLink="/user/home">Back to flight search</a><h1>Admin sign in</h1><p>Sign in to manage demo airports, operators and schedules.</p><form #authForm="ngForm" (ngSubmit)="onSubmit(authForm)"><label for="username">Admin email</label><input type="email" class="form-control" id="username" autocomplete="username" ngModel name="email" required email/><label for="password">Password</label><input type="password" class="form-control" id="password" autocomplete="current-password" ngModel name="password" required/><p *ngIf="error" class="alert alert-warning" role="alert">{{ error }}</p><button type="submit" class="btn btn-primary" [disabled]="!authForm.valid || submitting">{{ submitting ? 'Signing in...' : 'Sign in' }}</button></form></section>
