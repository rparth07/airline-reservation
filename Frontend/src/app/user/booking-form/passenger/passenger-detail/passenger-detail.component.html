<div
  class="passenger-fields"
  [ngModelGroup]="passengerGroupName"
>
  <div class="passenger-field">
    <div><label [for]="passengerGroupName + '-name'">Name</label></div>
    <input
      class="form-control mt-2 search-box-input"
      name="name"
      pattern=".*\S.*"
      [id]="passengerGroupName + '-name'"
      placeholder="Fictional full name"
      ngModel
      required
      #name="ngModel"
    />
    <span
      class="field-error"
      [hidden]="!name.touched || name.valid"
      >Please enter your name</span
    >
  </div>
  <div class="passenger-field">
    <div><label [for]="passengerGroupName + '-age'">Age</label></div>
    <input
      type="number"
      [min]="minAge"
      [max]="maxAge"
      class="form-control mt-2 search-box-input"
      name="age"
      step="1"
      pattern="[0-9]+"
      [id]="passengerGroupName + '-age'"
      placeholder="Enter Age"
      #age="ngModel"
      ngModel
      required
    />
    <span
      class="help-block field-error"
      [hidden]="!age.touched || age.valid"
      >Enter an age from {{ minAge }} to {{ maxAge }}</span
    >
  </div>
  <div class="passenger-field">
    <div><label [for]="passengerGroupName + '-gender'">Gender</label></div>
    <ng-select
      [items]="gender"
      [labelForId]="passengerGroupName + '-gender'"
      class="mt-2 search-box-input"
      [searchable]="false"
      placeholder="Choose gender"
      name="gender"
      [(ngModel)]="selectedGender"
      required
    >
    </ng-select>
  </div>
</div>
