<li class="flight-option" [class.active-flight]="isActive">
<button type="button" class="flight-choice" [attr.aria-pressed]="isActive" (click)="addSelectedFlightToSummaryList()"><div class="flight-option-heading"><span>{{ flightInfo[0].flightOperatorName }}</span><span class="selection-state">{{ isActive ? 'Selected' : 'Select flight' }}</span></div>
<div class="flight-option-grid">
<div><span class="field-caption">Departure</span><strong>{{ sourceFlightInfo.sourceDepartureTime }}</strong><span>{{ sourceFlightInfo.sourceCity }}</span></div>
<div class="flight-duration"><span class="field-caption">Duration</span><strong>{{ totalDuration }}</strong><span>{{ noOfStops }}</span></div>
<div><span class="field-caption">Arrival</span><strong>{{ destinationFlightInfo.destinationArrivalTime }}</strong><span>{{ destinationFlightInfo.destinationCity }}</span></div>
<div class="flight-fare"><span class="field-caption">Fare</span><strong>{{ totalCharges | decimalFormatter | custom_currency }}</strong></div>
</div></button>
<details *ngIf="flightInfo.length > 1" class="connection-details" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()"><summary>View connection details</summary><ol><li *ngFor="let segment of flightInfo"><strong>{{ segment.sourceCity }} to {{ segment.destinationCity }}</strong><span>{{ segment.sourceDepartureTime }} - {{ segment.destinationArrivalTime }} · {{ segment.flightOperatorName }}</span></li></ol></details>
</li>
