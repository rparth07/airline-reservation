<section class="flight-list" [attr.aria-label]="selectedFlightIndex === 0 ? 'Departure flight options' : 'Next flight options'">
<div class="flight-list-heading"><h2>{{ selectedFlightIndex === 0 ? 'Departure flights' : 'Flight ' + (selectedFlightIndex + 1) }}</h2><span>{{ flightInfoList.length }} options - Lowest fare first</span></div>
<ul class="flight-options"><app-flight *ngFor="let flightInfo of flightInfoList; let i = index" (click)="selectFlight(i)" (keydown.enter)="selectFlight(i)" (keydown.space)="selectFlight(i)" [isActive]="i === selectedList" [flightInfo]="flightInfo" [totalCharges]="calculateChanges(flightInfo)" [isFirstFlight]="i === selectedList" (onFlightSelect)="setSelectedFlight($event)"></app-flight></ul>
</section>
