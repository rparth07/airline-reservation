<div class="my-container">
  <p *ngIf="searchError" role="alert" class="alert alert-danger">{{ searchError }}</p>
  <p *ngIf="validationMessage" class="alert alert-warning" role="status">{{ validationMessage }}</p>
  <form (ngSubmit)="onSubmit(form)" #form="ngForm">
    <div class="row mr-ml-0 mt-2 sreach-widget">
      <div class="col-md-1 col-sm-6 col-xs-12 input-box">
        <label for="tripType" class="form-label">Trip Type </label>
        <ng-select
          labelForId="tripType"
          [items]="tripTypes"
          [(ngModel)]="selectedTripType"
          name="tripType"
          [searchable]="false"
          [clearable]="false"
          class="text-style"
          #tripType="ngModel"
          required
          (change)="onValueChanged()"
        >
        </ng-select>
      </div>

      <app-city-search-input
        *ngIf="selectedTripType !== multicity"
        class="col-4 pe-0 ps-0"
        [citiesToInterchange]="
          oneWayRoundFormData
            ? oneWayRoundFormData.citySearch
            : getEmptyTemplate()
        "
        groupName="citySearch"
        (valueChange)="onValueChanged()"
      ></app-city-search-input>

      <app-date-selection-input
        *ngIf="selectedTripType !== multicity"
        class="col-3 pe-0 ps-0"
        [tripType]="selectedTripType"
        [tripDate]="
          oneWayRoundFormData
            ? oneWayRoundFormData.tripDate
            : {
                departureDate: getEmptyTemplate().departureDate.toString()
              }
        "
        groupName="tripDate"
        (valueChange)="onValueChanged()"
      ></app-date-selection-input>

      <div *ngIf="selectedTripType === multicity" class="input-box">
        <label for="edit-itinerary" class="form-label">Itinerary</label>
        <button type="button" id="edit-itinerary" class="from-city itinerary-trigger" (click)="open(content)">
          <span>{{ cityConfig?.sourceCity ? cityConfig.sourceCity + ' to ' + cityConfig.destinationCity : 'Choose flights' }}</span>
          <span class="itinerary-edit">Edit {{ multicityList.length }} flights</span>
        </button>
      </div>

      <div class="col-md-1 input-box">
        <label for="travelClass" class="form-label">Class</label>
        <ng-select
          labelForId="travelClass"
          [items]="flightClassList"
          [(ngModel)]="selectedFlightClass"
          name="flightClass"
          [searchable]="false"
          [clearable]="false"
          class="search-box-input"
          required
          (change)="onValueChanged()"
        >
        </ng-select>
      </div>

      <div class="col-lg-1 col-md-2 d-flex flex-column input-box">
        <app-ridership
          [passengerCountByType]="
            oneWayRoundFormData
              ? oneWayRoundFormData.ridership
              : multicityFormData.ridership
          "
          (valueChanged)="onValueChanged()"
        ></app-ridership>
      </div>

      <div class="col-md-1 d-flex align-items-end input-box">
        <button
          type="submit"
          class="btn search-button"
          [disabled]="!form.valid || !validSearch || searching"
        >
          <span class="text-light">{{ searching ? 'Searching...' : 'Search' }}</span>
        </button>
      </div>
    </div>

    <!--  -->
    <!--  -->

    <ng-template #content let-modal>
      <div class="modal-header itinerary-header">
        <div>
          <h2 class="modal-title" id="multicity-editor-title">Edit multicity trip</h2>
          <p id="multicity-editor-description">Choose 2 to 5 flights in travel order.</p>
        </div>
        <button type="button" class="itinerary-close" aria-label="Close itinerary editor" (click)="modal.dismiss()">&times;</button>
      </div>
      <form #multicityForm="ngForm" class="itinerary-form" (ngSubmit)="applyMulticityEdit() && modal.close()">
        <div class="modal-body itinerary-body">
          <section class="itinerary-leg" *ngFor="let leg of draftLegs; let i = index" [attr.aria-labelledby]="'leg-title-' + i">
            <div class="leg-heading">
              <h3 [id]="'leg-title-' + i"><span class="leg-number">{{ i + 1 }}</span> Flight {{ i + 1 }}</h3>
              <button type="button" class="remove-leg" (click)="removeDraftLeg(i)" [disabled]="draftLegs.length <= 2" [attr.aria-label]="'Remove flight ' + (i + 1)" title="A multicity trip needs at least two flights">Remove</button>
            </div>
            <div class="leg-fields">
              <div class="leg-field">
                <label [for]="'leg-from-' + i">From</label>
                <ng-select [items]="airports" bindLabel="airportName" bindValue="abbreviation" [(ngModel)]="leg.sourceCity" [name]="'from-' + i" [labelForId]="'leg-from-' + i" [clearable]="false" appendTo=".multicity-editor-window" placeholder="Choose airport" required></ng-select>
              </div>
              <div class="leg-field">
                <label [for]="'leg-to-' + i">To</label>
                <ng-select [items]="airports" bindLabel="airportName" bindValue="abbreviation" [(ngModel)]="leg.destinationCity" [name]="'to-' + i" [labelForId]="'leg-to-' + i" [clearable]="false" appendTo=".multicity-editor-window" placeholder="Choose airport" required></ng-select>
              </div>
              <div class="leg-field leg-date">
                <label [for]="'leg-date-' + i">Departure</label>
                <input class="form-control" type="date" [id]="'leg-date-' + i" [name]="'date-' + i" [(ngModel)]="leg.departureDate" [min]="i ? draftLegs[i - 1].departureDate || today : today" required />
              </div>
            </div>
          </section>
          <div class="add-leg-row">
            <button type="button" class="btn btn-outline-primary" (click)="addDraftLeg()" [disabled]="draftLegs.length >= 5">+ Add flight</button>
            <span>{{ draftLegs.length }} of 5 flights</span>
          </div>
          <p *ngIf="draftError" class="alert alert-warning mb-0 mt-3" role="alert">{{ draftError }}</p>
        </div>
        <div class="modal-footer itinerary-footer">
          <button type="button" class="btn btn-outline-secondary" (click)="modal.dismiss()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="!multicityForm.valid || !draftValid">Save itinerary</button>
        </div>
      </form>
    </ng-template>
  </form>
  <!--  -->
  <!--  -->
</div>
