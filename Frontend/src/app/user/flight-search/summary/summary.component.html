<section class="selection-summary" *ngIf="summaryList.length" aria-label="Selected flights">
<div class="selected-routes"><ng-container *ngFor="let flight of summaryList"><div *ngIf="flight" class="selected-route"><span>{{ flight.itinerary }}</span><strong>{{ flight.price | decimalFormatter | custom_currency }}</strong></div></ng-container></div>
<div class="summary-actions"><div><span>Selected flights total</span><strong>{{ totalPrice | decimalFormatter | custom_currency }}</strong></div><button type="button" class="btn btn-primary" (click)="onSubmit()" [disabled]="!allLegsSelected">{{ allLegsSelected ? 'Continue to passengers' : 'Select every flight' }}</button></div>
</section>
