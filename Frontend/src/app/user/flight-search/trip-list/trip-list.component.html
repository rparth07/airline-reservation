<nav class="trip-tabs" aria-label="Choose flight leg"><button type="button" *ngFor="let trip of tripList; let i = index" (click)="selectTrip(i)" [attr.aria-pressed]="i === selectedTrip" [class.active-trip]="i === selectedTrip"><span>{{ trip[0][0].sourceCity }} to {{ trip[0][trip[0].length - 1].destinationCity }}</span><small>{{ tripDate[i] }}</small></button></nav>
<app-flights [flightInfoList]="tripList[selectedTrip]" [selectedFlightIndex]="selectedTrip"></app-flights>
