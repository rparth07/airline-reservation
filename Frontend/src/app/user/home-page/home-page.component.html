<div class="container">
  <div
    class="d-flex flex-nowrap flex-column align-items-center justify-content-center"
  >
    <h2 class="title">Find Flights</h2>
    <p *ngIf="loading" role="status">Starting the demo flight service. The first visit can take about a minute...</p>
    <div *ngIf="airportError" class="alert alert-warning" role="alert">
      <h3>Flight service is unavailable</h3>
      <p>We couldn't load airports. Flight search and booking need a connection to the reservation service. Please try again.</p>
      <button type="button" class="btn btn-primary" (click)="loadAirports()" [disabled]="loading">Try again</button>
    </div>
    <div *ngIf="airportsReady" class="container widget">
      <ul class="nav ms-5">
        <li>
          <a
            class="oneway"
            [ngClass]="{ active: !isMulticity && isOneWay }"
            (click)="changeToOneWay()" role="button" tabindex="0" (keydown.enter)="changeToOneWay()"
            >One-way</a
          >
        </li>
        <li>
          <a
            class="round-trip"
            [ngClass]="{ active: !isMulticity && !isOneWay }"
            (click)="changeToRoundTrip()" role="button" tabindex="0" (keydown.enter)="changeToRoundTrip()"
            >Round-trip</a
          >
        </li>
        <li>
          <a
            class="multicity"
            [ngClass]="{ active: isMulticity }"
            (click)="changeToMulticity()" role="button" tabindex="0" (keydown.enter)="changeToMulticity()"
            >Multicity</a
          >
        </li>
      </ul>

      <div class="me-3 ms-3 mt-5">
        <div id="one-way-round" *ngIf="!isMulticity" class="ms-2">
          <app-one-way-round [tripType]="isOneWay"></app-one-way-round>
        </div>
        <div id="multiCity" *ngIf="isMulticity">
          <app-multicity></app-multicity>
        </div>
      </div>
    </div>
  </div>
</div>
<div
  class="image-container d-flex align-items-center justify-content-center mt-5"
>
  <img src="../../assets/images/welcome.png" alt="welcome image" />
</div>
