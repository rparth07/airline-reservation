<section class="home-search" aria-labelledby="search-title">
<header class="page-heading"><h1 id="search-title">Find flights</h1><p>Choose your route, travel dates and passengers.</p></header>
<p *ngIf="loading" role="status" class="service-status">Starting the demo flight service. The first visit can take about a minute...</p>
<div *ngIf="airportError" class="alert alert-warning" role="alert"><h2>Flight service is unavailable</h2><p>We couldn't load airports. Search and booking need a connection to the reservation service.</p><button type="button" class="btn btn-primary" (click)="loadAirports()" [disabled]="loading">Try again</button></div>
<div *ngIf="airportsReady" class="widget">
<div class="trip-tabs" role="group" aria-label="Trip type">
<button type="button" [class.active]="!isMulticity && isOneWay" [attr.aria-pressed]="!isMulticity && isOneWay" (click)="changeToOneWay()">One-way</button>
<button type="button" [class.active]="!isMulticity && !isOneWay" [attr.aria-pressed]="!isMulticity && !isOneWay" (click)="changeToRoundTrip()">Round-trip</button>
<button type="button" [class.active]="isMulticity" [attr.aria-pressed]="isMulticity" (click)="changeToMulticity()">Multicity</button>
</div>
<app-one-way-round *ngIf="!isMulticity" [tripType]="isOneWay"></app-one-way-round>
<app-multicity *ngIf="isMulticity"></app-multicity>
</div>
</section>
