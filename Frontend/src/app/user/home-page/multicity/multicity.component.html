<p *ngIf="searchError" role="alert" class="alert alert-warning">{{ searchError }}</p>
<form #form="ngForm" (ngSubmit)="redirect(form)">
<h2 class="multi-heading">Flight 1</h2>
<app-trip-inputs [isMultiCity]="true"></app-trip-inputs>
<section class="home-leg" *ngFor="let leg of multicityList; let i = index">
<div class="home-leg-heading"><h2>Flight {{ i + 2 }}</h2><button type="button" class="btn btn-outline-secondary" (click)="removeTrip(i)" [disabled]="tripCount <= 2" [attr.aria-label]="'Remove flight ' + (i + 2)">Remove</button></div>
<app-trip-direction [citiesToInterchange]="leg" [groupName]="'tripDirection' + i"></app-trip-direction>
</section>
<div class="multi-actions"><button type="button" class="btn btn-outline-primary" (click)="addTrip()" [disabled]="tripCount >= 5">Add another flight</button><span>{{ tripCount }} of 5 flights</span></div>
<div class="search-container"><button class="btn search" type="submit" [disabled]="!form.valid || searching">{{ searching ? 'Searching...' : 'Search flights' }}</button></div>
</form>
