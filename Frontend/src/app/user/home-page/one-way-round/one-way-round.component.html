<p *ngIf="searchError" role="alert" class="alert alert-warning">{{ searchError }}</p>
<form (ngSubmit)="redirect(form)" #form="ngForm">
  <app-trip-inputs [tripType]="isOneWay"></app-trip-inputs>
  <div
    class="d-flex align-items-center justify-content-center search-container"
  >
    <button
      class="btn search mb-1"
      type="submit"
      [disabled]="!form.valid || searching"
    >
      {{ searching ? 'Searching...' : 'Search flights' }}
    </button>
  </div>
</form>
