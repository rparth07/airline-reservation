<div class="passenger-control" (keydown.escape)="hidePassengerCounter = true">
<span class="passenger-label">Passengers</span>
<button type="button" class="travelers" aria-label="Choose passengers" [attr.aria-expanded]="!hidePassengerCounter" (click)="hidePassengerCounter = !hidePassengerCounter" #passengerBox>{{ passengers }} {{ passengers === 1 ? 'traveler' : 'travelers' }}</button>
<input type="hidden" name="ridership" [ngModel]="passengerCountByType" />
<app-ridership-counter-card (ridershipCountChange)="onRidershipCountChange($event)" (isPassengersValidated)="togglePassengerCounter($event)" [hidden]="hidePassengerCounter" [typeOfPassengers]="passengerCountByType" (valueChange)="onValueChange()"></app-ridership-counter-card>
</div>
