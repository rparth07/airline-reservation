<div class="route-fields" *ngIf="isDataAvailable" [ngModelGroup]="groupName">
<div class="route-field"><label [for]="groupName + '-from'">From</label><ng-select [labelForId]="groupName + '-from'" [items]="cities" bindLabel="airportName" bindValue="abbreviation" [(ngModel)]="citiesToInterchange.sourceCity" (change)="isDuplicateCityEntered()" name="sourceCity" placeholder="Choose airport" [clearable]="false" #sourceCity="ngModel" required></ng-select></div>
<button type="button" class="swap-airports" aria-label="Swap airports" (click)="onInterchange()"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h15m-4-4 4 4-4 4M20 16H5m4-4-4 4 4 4"/></svg></button>
<div class="route-field"><label [for]="groupName + '-to'">To</label><ng-select [labelForId]="groupName + '-to'" [items]="cities" bindLabel="airportName" bindValue="abbreviation" [(ngModel)]="citiesToInterchange.destinationCity" (change)="isDuplicateCityEntered()" name="destinationCity" placeholder="Choose airport" [clearable]="false" #destinationCity="ngModel" required></ng-select></div>
<div class="route-field"><label [for]="groupName + '-departure'">Departure</label><input type="date" [id]="groupName + '-departure'" [(ngModel)]="departureDate" (change)="setCurrentDate()" name="departureDate" [min]="currentDate" class="form-control" required /></div>
<p *ngIf="isDuplicateCity" class="field-error" role="alert">Choose different departure and arrival airports.</p>
</div>
