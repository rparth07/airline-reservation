<div class="trip-fields" [class.multicity-options]="isMultiCity">
<app-trip-direction></app-trip-direction>
<div *ngIf="!isMultiCity" class="field">
<label for="home-return">Return</label>
<input *ngIf="!isOneWay" type="date" id="home-return" [(ngModel)]="returnDate" name="returnDate" [min]="departureDate" required class="form-control" />
<button *ngIf="isOneWay" type="button" class="return-trigger" (click)="enableReturnDateInputBox()">Add return date</button>
</div>
<div class="field"><label for="home-class">Class</label><ng-select labelForId="home-class" [(ngModel)]="selectedClass" name="flightClass" [clearable]="false" [searchable]="false"><ng-option *ngFor="let class of classes" [value]="class">{{ class }}</ng-option></ng-select></div>
<div class="field"><app-ridership></app-ridership></div>
</div>
